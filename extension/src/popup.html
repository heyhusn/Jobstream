<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=300, initial-scale=1.0" />
  <title>Save to JobSpy</title>
  <style>
    :root {
      --bg: #F5F4F0;
      --surface: #FFFFFF;
      --rule: #E5E4E0;
      --ink: #111111;
      --ink-70: #4B4B4B;
      --brand: #E44C27;
      --brand-hover: #C94222;
      --radius: 6px;
    }
    
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      padding: 12px 16px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      padding: 16px;
    }

    .hidden {
      display: none !important;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      background: var(--surface);
      margin-bottom: 12px;
      font-family: inherit;
      font-size: 13px;
    }
    
    textarea {
      resize: vertical;
      min-height: 80px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--ink-70);
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    
    button.primary {
      background: var(--ink);
      color: var(--surface);
    }
    
    button.primary:hover {
      background: #000;
    }
    
    button.primary:disabled {
      background: var(--ink-70);
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    button.secondary {
      background: var(--surface);
      border: 1px solid var(--rule);
      color: var(--ink);
      margin-top: 8px;
    }
    
    button.secondary:hover {
      background: #fcfcfc;
    }

    .error {
      color: var(--brand);
      font-size: 12px;
      margin-bottom: 12px;
      padding: 8px;
      background: #fbeee8;
      border-radius: var(--radius);
    }

    .success-icon {
      font-size: 32px;
      text-align: center;
      margin-bottom: 12px;
    }

    .text-center {
      text-align: center;
    }
    
    a {
      color: var(--ink);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>JobSpy</span>
    <span id="logout-btn" style="font-size:12px; font-weight:normal; cursor:pointer; color:var(--ink-70)" class="hidden">Sign out</span>
  </div>

  <div class="container">
    <!-- Auth View -->
    <div id="auth-view" class="hidden">
      <p style="margin-top:0; font-size:13px; color:var(--ink-70)">Sign in to your JobSpy account to save postings.</p>
      <div id="auth-error" class="error hidden"></div>
      
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
      
      <label>Password</label>
      <input type="password" id="password" />
      
      <button id="login-btn" class="primary">Sign in</button>
    </div>

    <!-- Review View -->
    <div id="review-view" class="hidden">
      <div id="save-error" class="error hidden"></div>
      
      <label>Job Title</label>
      <input type="text" id="job-title" />
      
      <label>Company</label>
      <input type="text" id="job-company" />
      
      <label>Location</label>
      <input type="text" id="job-location" placeholder="Remote, New York, etc." />
      
      <label>Description</label>
      <textarea id="job-description"></textarea>
      
      <button id="save-btn" class="primary">Save to Tracker</button>
    </div>

    <!-- Success View -->
    <div id="success-view" class="hidden text-center">
      <div class="success-icon">✓</div>
      <h3 style="margin-top:0">Saved!</h3>
      <p style="color:var(--ink-70); font-size:13px" id="success-message">This job is now in your tracker.</p>
      
      <button id="view-tracker-btn" class="secondary">Open Tracker</button>
    </div>
    
    <!-- Loading View -->
    <div id="loading-view" class="text-center" style="padding: 30px 0; color:var(--ink-70)">
      Loading...
    </div>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
